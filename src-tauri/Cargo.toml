[package]
name = "dailycockpit"
version = "0.1.0"
description = "Project-centric local-first AI development cockpit"
authors = ["Alan"]
edition = "2021"

[lib]
name = "dailycockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
git2 = { version = "0.21.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-android-workspace = { path = "plugins/android-workspace" }
tauri-plugin-dialog = "2.7.3"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
